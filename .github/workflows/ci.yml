name: Toolchain checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_llvm:
        description: Also build LLVM host tools from source
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make check

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.source_llvm && 360 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
      LLVM_MODE: ${{ inputs.source_llvm && 'source' || 'system' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          curl --fail --location --show-error --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-21 lld-21 llvm-21 llvm-21-dev cmake ninja-build curl xz-utils perl rsync patch pkg-config qemu-user
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: sources
          key: sources-${{ hashFiles('sources.list') }}
      - name: Build and run smoke tests
        run: |
          if [ "$ARCH" = aarch64 ]; then
            make JOBS=2 RUNNER=qemu-aarch64
          else
            make JOBS=2
          fi
      - name: Check a resumed build
        run: make runtimes JOBS=2
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.arch }}
          path: |
            build/work/**/CMakeCache.txt
            build/work/**/CMakeFiles/CMakeConfigureLog.yaml
            build/work/**/verify/*.header
            build/work/**/verify/*.segments
            build/work/**/verify/*.dynamic
