# clang never warns about unused config options, so -Werror builds keep working
--target=@TARGET@
--gcc-toolchain=<CFGDIR>/empty-gcc
-resource-dir=<CFGDIR>/../../lib/clang/@RESOURCE_VERSION@
--rtlib=compiler-rt
--unwindlib=libunwind
-stdlib=libc++
--ld-path=<CFGDIR>/../../libexec/ld.lld
# chimera linux hardening defaults
-fstack-protector-strong
-fno-semantic-interposition
-Wl,--as-needed
-Wl,-z,relro,-z,now
